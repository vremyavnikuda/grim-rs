name: Labeler

on:
  issues:
    types: [opened, edited]
  pull_request_target:
    types: [opened, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    name: Assign type and platform labels
    runs-on: ubuntu-latest
    steps:
      - name: Label issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = context.payload.issue.title.toLowerCase();
            const body = context.payload.issue.body || '';
            const text = title + '\n' + body.toLowerCase();

            const labels = [];
            const TYPES = ['bug', 'enhancement', 'documentation', 'refactor', 'question', 'performance'];

            // Type: sections produced by the issue templates.
            if (/^#+\s*what happened\??\s*$/im.test(body)) {
              labels.push('bug');
            } else if (/^#+\s*details\s*$/im.test(body)) {
              labels.push('enhancement');
            }

            // Platform: the Platform section of the issue template.
            const platHeading = body.match(/^#+\s*platform\s*\n+[\s>*-]*\s*(windows|linux\s*\/\s*wayland|both|cross|all)\s*$/im);
            if (platHeading) {
              const v = platHeading[1].toLowerCase();
              labels.push(v === 'windows' ? 'platform:windows' : (v.startsWith('linux') ? 'platform:linux' : 'platform:cross'));
            }

            // Keyword fallback for issues not created from a template.
            if (!labels.some(l => TYPES.includes(l))) {
              const rules = [
                ['bug', /\b(panic|crash|segfault|regression|broken|error)\b/],
                ['enhancement', /\b(feature|support for|would be nice|please implement|coverage)\b/],
                ['question', /\b(how (do|can) i|how to|question)\b/],
                ['documentation', /\b(documentation|docs|readme|changelog|typo)\b/],
                ['refactor', /\b(refactor|cleanup|unused|dead code)\b/],
              ];
              labels.push(...rules.filter(([, re]) => re.test(text)).map(([l]) => l));
            }
            if (!labels.some(l => l.startsWith('platform:'))) {
              const windows = /\b(windows|dxgi|d3d11)\b/.test(text);
              const linux = /\b(linux|wayland|wlroots|sway|hyprland|niri|river|wayfire|cosmic)\b/.test(text);
              if (windows && !linux) labels.push('platform:windows');
              else if (linux && !windows) labels.push('platform:linux');
              else if (windows && linux) labels.push('platform:windows', 'platform:linux');
              else labels.push('platform:cross');
            }

            if (labels.length) {
              await github.rest.issues.addLabels({
                owner, repo,
                issue_number: context.payload.issue.number,
                labels,
              });
            }

      - name: Label pull request
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const title = pr.title.toLowerCase();
            const prefix = {
              'fix': 'bug',
              'feat': 'enhancement',
              'docs': 'documentation',
              'perf': 'performance',
              'refactor': 'refactor',
              'ci': 'dependencies',
              'build': 'dependencies',
            };
            const labels = [];
            const m = title.match(/^(\w+)(?:\(([^)]+)\))?!?:/);
            if (m) {
              if (prefix[m[1]]) {
                labels.push(prefix[m[1]]);
              } else if (m[1] === 'chore' && m[2] && m[2].includes('deps')) {
                labels.push('dependencies');
              }
            }
            const prText = title + '\n' + ((pr.body || '')).toLowerCase();
            const windows = /\b(windows|dxgi|d3d11)\b/.test(prText);
            const linux = /\b(linux|wayland|wlroots|sway|hyprland|niri|river|wayfire|cosmic)\b/.test(prText);
            if (windows && !linux) labels.push('platform:windows');
            else if (linux && !windows) labels.push('platform:linux');
            else if (windows && linux) labels.push('platform:windows', 'platform:linux');
            else labels.push('platform:cross');
            labels.push(pr.draft ? 'status:in-progress' : 'status:needs-review');
            await github.rest.issues.addLabels({
              owner, repo,
              issue_number: pr.number,
              labels,
            });
