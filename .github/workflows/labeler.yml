name: Labeler

on:
  issues:
    types: [opened, edited, reopened, closed, labeled, unlabeled]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, edited, reopened, closed, synchronize, ready_for_review, converted_to_draft, labeled, unlabeled]
  workflow_run:
    workflows: [CI, Tests, PR Quality]
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report changes without applying them
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  checks: read
  issues: write
  pull-requests: write

concurrency:
  group: label-policy
  queue: max
  cancel-in-progress: false

jobs:
  reconcile:
    name: Synchronize owned labels
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Reconcile labels
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const { run } = require('./.github/scripts/labeler.cjs');
            await run({ github, context, core,
              dryRun: context.eventName === 'workflow_dispatch' && context.payload.inputs?.dry_run !== 'false' });
