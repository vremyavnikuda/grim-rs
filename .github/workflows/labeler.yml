name: Labeler

on:
  issues:
    types: [opened, edited]
  pull_request_target:
    types: [opened, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    name: Assign type and status labels
    runs-on: ubuntu-latest
    steps:
      - name: Label issue by keywords
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = context.payload.issue.title.toLowerCase();
            const body = (context.payload.issue.body || '').toLowerCase();
            const text = title + '\n' + body;
            const rules = [
              ['bug', /\b(panic|crash|segfault|regression|broken|error)\b/],
              ['enhancement', /\b(feature|support for|would be nice|please implement)\b/],
              ['question', /\b(how (do|can) i|how to|question)\b/],
              ['documentation', /\b(documentation|docs|readme|changelog|typo)\b/],
            ];
            const platforms = [
              ['platform:windows', /\b(windows|dxgi|d3d11)\b/],
              ['platform:linux', /\b(linux|wayland|wlroots|sway|hyprland|niri|river|wayfire|cosmic)\b/],
            ];
            const labels = rules.filter(([, re]) => re.test(text)).map(([l]) => l)
              .concat(platforms.filter(([, re]) => re.test(text)).map(([l]) => l));
            if (labels.length) {
              await github.rest.issues.addLabels({
                owner, repo,
                issue_number: context.payload.issue.number,
                labels,
              });
            }

      - name: Label PR by conventional title and draft state
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const title = pr.title.toLowerCase();
            const prefix = {
              'fix': 'bug',
              'feat': 'enhancement',
              'docs': 'documentation',
              'perf': 'performance',
              'refactor': 'refactor',
              'ci': 'dependencies',
              'build': 'dependencies',
            };
            const labels = [];
            const m = title.match(/^(\w+)(?:\(([^)]+)\))?!?:/);
            if (m) {
              if (prefix[m[1]]) {
                labels.push(prefix[m[1]]);
              } else if (m[1] === 'chore' && m[2] && m[2].includes('deps')) {
                labels.push('dependencies');
              }
            }
            const prText = title + '\n' + ((pr.body || '')).toLowerCase();
            if (/\b(windows|dxgi|d3d11)\b/.test(prText)) {
              labels.push('platform:windows');
            }
            if (/\b(linux|wayland|wlroots|sway|hyprland|niri|river|wayfire|cosmic)\b/.test(prText)) {
              labels.push('platform:linux');
            }
            labels.push(pr.draft ? 'status:in-progress' : 'status:needs-review');
            await github.rest.issues.addLabels({
              owner, repo,
              issue_number: pr.number,
              labels,
            });
