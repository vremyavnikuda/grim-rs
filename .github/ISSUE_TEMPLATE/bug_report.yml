name: Bug report
description: Report behavior that does not work as expected
body:
  - type: dropdown
    id: issue-kind
    attributes:
      label: Issue kind
      options:
        - Bug report
      default: 0
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Affected platforms
      description: Select affected systems, or one exclusive Unknown / Not platform-specific answer.
      multiple: true
      options:
        - Windows
        - Linux
        - Unknown
        - Not platform-specific
    validations:
      required: true
  - type: dropdown
    id: backends
    attributes:
      label: Linux backends
      description: Select the Linux backends involved. X11 support is planned. For Windows-only or general API topics, select Not applicable. Other / Unknown / Not applicable must be selected alone.
      multiple: true
      options:
        - Wayland
        - X11
        - Other
        - Unknown
        - Not applicable
    validations:
      required: true
  - type: input
    id: other-backend
    attributes:
      label: Other backend
      description: If you selected Other, name it here.
  - type: input
    id: version
    attributes:
      label: grim-rs version
      description: Version or Git revision used.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened? Include the relevant error.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction or conditions
      description: Steps or a minimal example; for intermittent issues describe the required setup.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS version, compositor or desktop, GPU and driver when relevant.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs and minimal example
      description: Remove secrets and personal data before posting logs or code.
    validations:
      required: false
