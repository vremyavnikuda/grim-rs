name: Feature request
description: Suggest an improvement or new capability
body:
  - type: markdown
    attributes:
      value: "Kind: enhancement"
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform is this for?
      options:
        - Both
        - Windows
        - Linux / Wayland
    validations:
      required: true
  - type: input
    id: summary
    attributes:
      label: Summary
      description: One line describing the request
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What and why; current behavior if relevant
    validations:
      required: true
