[package]
name = "grim-rs"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "Rust implementation of grim screenshot utility for Wayland and Windows"
license-file = "LICENSE"
keywords = ["wayland", "screenshot", "grim", "windows", "dxgi"]
categories = ["graphics", "api-bindings"]
repository = "https://github.com/vremyavnikuda/grim-rs"
documentation = "https://docs.rs/grim-rs"
homepage = "https://github.com/vremyavnikuda/grim-rs"
readme = "README.md"
exclude = ["/target", ".gitignore", "todo.md", "grim.md"]
authors = ["vremyavnikuda <vremyavnikuda@protonmail.com>"]

[lib]
name = "grim_rs"
crate-type = ["lib"]

[[bin]]
name = "grim-rs"
path = "src/bin/grim.rs"

[dependencies]
# jpeg-encoder 0.7 requires Rust 1.87+; the lockfile pins 0.6.1 to keep the
# declared MSRV 1.82 buildable.
jpeg-encoder = { version = "0.6", optional = true }
png = { version = "0.17.0", optional = true }
log = "0.4.29"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
memmap2 = "0.9.9"
tempfile = "3.24.0"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_Time",
] }

[dev-dependencies]
env_logger = "0.10"
regex = "1.10"
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }
libc = "0.2"
dhat = "0.3"

[[bench]]
name = "capture_benchmarks"
harness = false

[[bench]]
name = "encode_benchmarks"
harness = false

[[bench]]
name = "alloc_profiler"
harness = false

[features]
default = ["png_support", "jpeg"]
png_support = ["png"]
jpeg = ["jpeg-encoder", "png_support"]
